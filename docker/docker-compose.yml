# ============================================
# MLOps Pipeline - Docker Compose
# ============================================
# Orquestación de servicios:
# - API Flask (predicciones)
# - Streamlit Dashboard (monitoreo)
# ============================================



services:
  # Servicio de API Flask para predicciones
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mlops-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=mlops_pipeline/src/model_deploy.py
      - PYTHONUNBUFFERED=1
      - PORT=5000
    volumes:
      # Montar artefactos del modelo (opcional, para hot-reload)
      - ../models/best_model.pkl:/app/models/best_model.pkl:ro
      - ../models/preprocessor.pkl:/app/models/preprocessor.pkl:ro
      - ../models/model_metadata.json:/app/models/model_metadata.json:ro
      - ../data/metadata/feature_engineering_metadata.json:/app/data/metadata/feature_engineering_metadata.json:ro
    restart: unless-stopped
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Servicio Streamlit para monitoreo y visualización
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: mlops-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      # Montar datos y reportes
      - ../data/processed/train_data.csv:/app/data/processed/train_data.csv:ro
      - ../data/processed/test_data.csv:/app/data/processed/test_data.csv:ro
      - ../data/metadata/drift_report.json:/app/data/metadata/drift_report.json:ro
      - ../models/model_metadata.json:/app/models/model_metadata.json:ro
    restart: unless-stopped
    networks:
      - mlops-network
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Servicio Frontend para interfaz de usuario
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: mlops-frontend
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api:5000
    restart: unless-stopped
    networks:
      - mlops-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  mlops-network:
    driver: bridge
    name: mlops-network

volumes:
  model-artifacts:
    name: mlops-model-artifacts

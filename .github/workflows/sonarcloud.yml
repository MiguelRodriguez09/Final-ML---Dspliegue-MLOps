
name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy
      
      - name: Set up Python
        # Pin a a stable Python version compatible with sonar-project.properties
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: SonarCloud Scan
        # Use a released (pinned) version of the SonarCloud GitHub Action
        # to avoid unexpected breaking changes from `master`.
        uses: SonarSource/sonarcloud-github-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Necesario para obtener info de PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Token de SonarCloud (agregar en secrets)
        with:
          args: >
            -Dsonar.projectKey=MiguelRodriguez09_Final-ML---Dspliegue-MLOps
            -Dsonar.organization=miguelrodriguez09
            -Dsonar.python.version=3.10

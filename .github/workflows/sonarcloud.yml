name: CI - Tests & SonarCloud

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Run tests and SonarCloud scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=mlops_pipeline --cov-report=xml -q

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.0.0
        with:
          organization: ${{ secrets.SONAR_ORGANIZATION }}
          token: ${{ secrets.SONAR_TOKEN }}

name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy
      
      - name: Set up Python
        # Pin a a stable Python version compatible with sonar-project.properties
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: SonarCloud Scan
        # Use v3 which includes Java 17+ compatible with modern SonarScanner (class version 61.0)
        # v1 used Java 11 which caused UnsupportedClassVersionError
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Necesario para obtener info de PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Token de SonarCloud (agregar en secrets)
        with:
          args: >
            -Dsonar.projectKey=MiguelRodriguez09_Final-ML---Dspliegue-MLOps
            -Dsonar.organization=miguelrodriguez09
            -Dsonar.python.version=3.10

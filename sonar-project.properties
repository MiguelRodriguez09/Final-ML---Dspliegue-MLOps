# ===================================================================
# SONARCLOUD CONFIGURATION
# ===================================================================

# Información del proyecto
sonar.projectKey=MiguelRodriguez09_Final-ML---Dspliegue-MLOps
sonar.organization=miguelrodriguez09

# Nombre y versión del proyecto
sonar.projectName=Final-ML-Despliegue-MLOps
sonar.projectVersion=1.0

# Directorio de código fuente
sonar.sources=mlops_pipeline/src
sonar.sourceEncoding=UTF-8

# Lenguajes a analizar
sonar.language=py

# Exclusiones (archivos que no se deben analizar)
sonar.exclusions=\
  **/Proyecto-venv/**,\
  **/__pycache__/**,\
  **/.ipynb_checkpoints/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.ipynb,\
  **/tests/**,\
  **/data/**,\
  **/models/**,\
  **/reports/**,\
  **/monitoring/**

# Cobertura de tests (si tienes tests)
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.python.xunit.reportPath=xunit-result.xml

# Configuración de Python
sonar.python.version=3.13

# Pylint
sonar.python.pylint=/usr/bin/pylint
sonar.python.pylint_config=.pylintrc

# Complejidad cognitiva
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S1541
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# Umbrales de duplicación
sonar.cpd.python.minimumtokens=50

# Nivel de log
sonar.log.level=INFO

# Configuración de análisis
sonar.qualitygate.wait=true

# Timeout para análisis
sonar.scm.disabled=false
sonar.scm.provider=git

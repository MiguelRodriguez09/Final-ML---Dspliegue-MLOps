# SonarCloud Configuration for Final-ML---Dspliegue-MLOps

# Organization and Project Keys
# IMPORTANTE: Actualiza estos valores con los que te proporciona SonarCloud
sonar.organization=miguelrodriguez09
sonar.projectKey=MiguelRodriguez09_Final-ML---Dspliegue-MLOps

# Project Information
sonar.projectName=Final-ML---Dspliegue-MLOps
sonar.projectVersion=1.0

# Source Code Location
# Path is relative to the sonar-project.properties file
# Use forward slashes (/) even on Windows
sonar.sources=mlops_pipeline/src

# Test Location (opcional - si tienes tests)
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Python Configuration
sonar.python.version=3.10

# Exclusions - Files/folders to ignore in analysis
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.ipynb,\
  **/venv/**,\
  **/env/**,\
  **/Proyecto-venv/**,\
  **/.git/**,\
  **/node_modules/**,\
  **/*.pyc

# Coverage Exclusions (opcional)
# sonar.coverage.exclusions=**/tests/**

# Path to coverage report generated by pytest-cov (coverage.xml)
# SonarCloud will pick this up during the scan
sonar.python.coverage.reportPaths=coverage.xml

# Duplicate Detection
sonar.cpd.exclusions=**/*.ipynb
